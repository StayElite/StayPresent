[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "staypresent"
version = "1.6.0"
description = "Keep your Python bots alive with automatic restarts, heartbeat monitoring, and a built-in status dashboard."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Ashish Sharma (Stay Elite)" }
]
requires-python = ">=3.8"

# Keywords and Classifiers MUST come before any [project.something] subtables
keywords = [
    # Core concepts
    "flask",
    "webserver",
    "keepalive",
    "bot",
    "process-monitoring",
    "process-manager",
    "service-monitoring",

    # Target integrations
    "telegram-bot",
    "discord-bot",
    "automation",
    "background-worker",

    # Target deployment platforms
    "render",
    "heroku",
    "railway",
    "koyeb",

    # Technical features
    "waitress",
    "wsgi",
    "auto-restart",
    "crash-recovery",
    "hosting",
    "deployment",
    "markdown",
    "multi-bot",
    "heartbeat",
    "health-check",
    "process-restart",
    "uptime",
    "status-dashboard",
    "monitoring",
    "worker",
    "background-process",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Server",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "Flask>=3.0.0"
]

[project.optional-dependencies]
prod = [
    "waitress>=2.1.2"
]

[project.urls]
Homepage = "https://github.com/StayElite/StayPresent"
Repository = "https://github.com/StayElite/StayPresent"
Issues = "https://github.com/StayElite/StayPresent/issues"
Documentation = "https://github.com/StayElite/StayPresent/blob/main/DOCUMENTATION.md"
Changelog = "https://github.com/StayElite/StayPresent/blob/main/CHANGELOG.md"